<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Risultati live, squadre, calendario, classifiche e albo d'oro del torneo MundialPitto.">
    <meta name="theme-color" content="#f2e8d5">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Torneo MundialPitto">
    <meta property="og:locale" content="it_IT">
    <meta property="og:title" content="Squadra - MundialPitto">
    <meta property="og:description" content="Risultati live, squadre, calendario, classifiche e albo d'oro del torneo MundialPitto.">
    <meta property="og:image" content="https://mundialpitto.vercel.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://mundialpitto.vercel.app/og-image.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Squadra - MundialPitto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Anton&family=Montserrat:ital,wght@0,800;0,900;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" id="main-style">
    <script>if(localStorage.getItem('mpTheme')==='old'){document.getElementById('main-style').setAttribute('href','style-old.css');}</script>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-brand">Torneo <span>MundialPitto</span></a>
        <div class="nav-links">
            <a href="index.html">Live & Risultati</a>
            <a href="squadre.html" class="active">Squadre</a>
            <a href="calendario.html">Calendario</a>
            <a href="classifica.html">Classifiche</a>
            <a href="storico.html">Albo d'Oro</a>
        </div>
        <div class="nav-spacer">
            <button id="theme-toggle-btn" class="btn-roster theme-toggle-btn" onclick="mpToggleTheme()" type="button">Stile precedente</button>
        </div>
    </nav>

    <div class="squadra-detail-container">

        <div class="squadra-hero" id="squadra-hero"></div>

        <div class="squadra-info-grid">

            <div class="info-card dirigenza">
                <h3>STAFF TECNICO</h3>
                <div class="dirigenza-item" id="dirigente-item" style="display: none;">
                    <span class="ruolo">Dirigente</span>
                    <span class="nome" id="dirigente">-</span>
                </div>
                <div class="dirigenza-item" id="allenatore-item" style="display: none;">
                    <span class="ruolo">Allenatore</span>
                    <span class="nome" id="allenatore">-</span>
                </div>
                <div class="dirigenza-item" id="assistente-item" style="display: none;">
                    <span class="ruolo">Assistente</span>
                    <span class="nome" id="assistente">-</span>
                </div>
                <div class="dirigenza-item" id="presidente-item" style="display: none;">
                    <span class="ruolo">Presidente</span>
                    <span class="nome" id="presidente">-</span>
                </div>
            </div>

            <div class="info-card stats">
                <h3>STATISTICHE</h3>
                <div class="stat-row">
                    <span>Giocatori in rosa</span>
                    <span class="value" id="num-giocatori">0</span>
                </div>
                <div class="stat-row">
                    <span>Girone</span>
                    <span class="value" id="girone">-</span>
                </div>
            </div>

        </div>

        <div class="roster-section">
            <h2 class="section-heading">ROSA DELLA SQUADRA</h2>
            <div class="roster-grid" id="roster-container"></div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 MundialPitto. Tutti i diritti riservati.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="script.js"></script>
    <script src="squadra-dettaglio.js"></script>

    <script src="theme-toggle.js"></script>
</body>
</html>
