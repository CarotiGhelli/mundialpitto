<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - MundialPitto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Anton&family=Montserrat:ital,wght@0,800;0,900;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" id="main-style">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
        }

        .admin-panel {
            background: var(--bg-card);
            border: 2px solid var(--border-glass);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .admin-section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--neon-green);
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-glass);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: var(--text-main);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .btn-submit {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.3) 0%, rgba(0, 255, 136, 0.1) 100%);
            color: var(--neon-green);
            border: 2px solid rgba(0, 255, 136, 0.5);
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.4) 0%, rgba(0, 255, 136, 0.2) 100%);
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.5);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        .btn-back {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }
        .btn-back:hover { background: rgba(255,255,255,0.1); }

        .match-list {
            display: grid;
            gap: 1rem;
        }

        .match-item {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .match-item:hover { background: rgba(0, 255, 136, 0.1); }

        .match-info { flex: 1; min-width: 0; }

        .match-title {
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .match-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-edit {
            background: rgba(0, 255, 136, 0.2);
            color: var(--neon-green);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .success-message {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .warning-message {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.5);
            color: #f59e0b;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        /* Fix visibilità dropdown su sfondo scuro */
        select option, select optgroup {
            background: #1a2035;
            color: #ffffff;
        }

        /* ===== MENU FASI ===== */
        .fasi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        .btn-fase {
            background: rgba(0, 255, 136, 0.08);
            border: 2px solid rgba(0, 255, 136, 0.3);
            color: var(--text-main);
            border-radius: 12px;
            padding: 1.5rem 1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-fase:hover {
            background: rgba(0, 255, 136, 0.18);
            border-color: var(--neon-green);
            transform: translateY(-2px);
        }

        /* Riga risultato */
        .score-input-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 1.5rem 0;
            background: rgba(0, 255, 136, 0.04);
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 10px;
            padding: 1rem 1.5rem;
        }
        .team-score-label { font-weight: 700; }

        /* ===== HEADER RISULTATO (crest + punteggio) =====
           Grid con le singole celle (badge/nome/contatore/trattino) come
           elementi diretti: cosi' l'impaginazione puo' cambiare del tutto
           tra desktop e mobile senza spostare nodi nel DOM. */
        .result-header {
            display: grid;
            grid-template-columns: auto auto auto auto auto;
            grid-template-areas:
                "badge1 .      .    .      badge2"
                "name1  score1 dash score2 name2";
            column-gap: 0.6rem;
            row-gap: 0.5rem;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
        }
        #rh-badge1 { grid-area: badge1; justify-self: center; }
        #rh-badge2 { grid-area: badge2; justify-self: center; }
        #rh-name1  { grid-area: name1;  justify-self: end; }
        #rh-name2  { grid-area: name2;  justify-self: start; }
        #goals-team1 { grid-area: score1; }
        #goals-team2 { grid-area: score2; }
        .score-sep { grid-area: dash; justify-self: center; }

        .result-header img, .result-header .team-badge {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }
        .result-team-name {
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
        }
        .score-num-input {
            width: 65px;
            padding: 0.6rem;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid rgba(0, 255, 136, 0.4);
            color: var(--neon-green);
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.4rem;
            text-align: center;
        }
        .score-sep {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-muted);
        }
        @media (max-width: 640px) {
            .result-header {
                grid-template-columns: auto 1fr auto;
                grid-template-areas:
                    "badge1 name1 score1"
                    "badge2 name2 score2";
                row-gap: 0.75rem;
            }
            .result-header img, .result-header .team-badge { width: 42px; height: 42px; }
            .result-header .score-sep { display: none; }
            #rh-name1, #rh-name2 { justify-self: start; }
        }

        /* ===== LISTE EVENTI (marcatori/cartellini) ===== */
        .events-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0 1.5rem;
        }
        .events-col-title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .event-chip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-glass);
            border-radius: 6px;
            padding: 0.4rem 0.6rem;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
        }
        .event-chip .ec-remove {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* ===== PANNELLI AGGIUNGI EVENTO ===== */
        .add-event-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 720px) {
            .add-event-panels, .events-columns { grid-template-columns: 1fr; }
        }
        .add-event-panel {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 1rem;
        }
        .aep-team-name {
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.75rem;
        }
        .aep-search {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.25);
            color: var(--text-main);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 0.6rem;
        }
        .type-toggle {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }
        .type-toggle button {
            flex: 1;
            padding: 0.5rem 0.4rem;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 6px;
            border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            cursor: pointer;
        }
        .type-toggle button.active-gol {
            background: rgba(0, 255, 136, 0.2);
            color: var(--neon-green);
            border-color: rgba(0, 255, 136, 0.4);
        }
        .type-toggle button.active-giallo {
            background: rgba(255, 215, 0, 0.18);
            color: #e6c200;
            border-color: rgba(255, 215, 0, 0.4);
        }
        .type-toggle button.active-rosso {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.4);
        }
        .player-pick-list {
            max-height: 260px;
            overflow-y: auto;
        }
        .player-pick-item {
            width: 100%;
            text-align: left;
            padding: 0.55rem 0.6rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.88rem;
            cursor: pointer;
            margin-bottom: 0.3rem;
        }
        .player-pick-item:hover {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
        }

        .btn-action-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .btn-forfeit {
            background: rgba(255, 165, 0, 0.15);
            color: #ffa500;
            border-color: rgba(255, 165, 0, 0.4);
            font-size: 0.85rem;
            padding: 0.6rem 1rem;
        }
        .btn-forfeit:hover { background: rgba(255, 165, 0, 0.25); }

        /* ===== AGGIUNGI GIOCATORI ===== */
        .aggp-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.6rem;
        }
        .aggp-row input {
            padding: 0.6rem;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.25);
            color: var(--text-main);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
        }
        .aggp-row .aggp-nome { flex: 2; min-width: 120px; }
        .aggp-row .aggp-cognome { flex: 2; min-width: 120px; }
        .aggp-row .aggp-numero { width: 70px; }
        .btn-add-row {
            background: rgba(0, 255, 136, 0.1);
            color: var(--neon-green);
            border: 1px solid rgba(0, 255, 136, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        .btn-add-row:hover { background: rgba(0, 255, 136, 0.2); }

        @media (max-width: 640px) {
            .admin-container { padding: 1rem 0.75rem; }
            .admin-panel { padding: 1.25rem; }
            .admin-section-title { font-size: 1.2rem; }
            .score-input-row { padding: 0.75rem; gap: 0.5rem; }
            .score-num-input { width: 55px; font-size: 1.2rem; }
            .btn-submit { padding: 0.85rem 1.25rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-brand">MundialPitto <span>ADMIN</span></a>
        <div class="nav-links">
            <a href="index.html">&#8592; Torna al Sito</a>
        </div>
    </nav>

    <div class="admin-container">

        <h1 style="text-align: center; color: var(--neon-green); margin-bottom: 2rem;">&#128295; PANNELLO AMMINISTRATORE</h1>

        <div class="success-message" id="success-msg"></div>
        <div class="error-message" id="error-msg"></div>
        <div class="warning-message" id="warning-msg"></div>

        <!-- ===== VISTA 1: MENU PRINCIPALE ===== -->
        <div id="view-menu">
            <div class="admin-panel">
                <div class="admin-section-title">Seleziona Fase</div>
                <div class="fasi-grid">
                    <button class="btn-fase" onclick="apriFase('girone')">&#9917;<br>Girone</button>
                    <button class="btn-fase" onclick="apriFase('triangolare')">&#128201;<br>Play In</button>
                    <button class="btn-fase" onclick="apriFase('semifinale')">&#127942;<br>Semifinale</button>
                    <button class="btn-fase" onclick="apriFase('finalina')">&#127941;<br>Finalina</button>
                    <button class="btn-fase" onclick="apriFase('finale')">&#128081;<br>Finale</button>
                </div>
            </div>

            <div class="admin-panel">
                <div class="admin-section-title">Aggiungi Giocatori</div>
                <div class="form-group">
                    <label>Seleziona Squadra</label>
                    <select id="aggp-team-select">
                        <option value="">-- Seleziona --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Rosa Attuale</label>
                    <div id="aggp-roster-corrente"></div>
                </div>

                <div id="aggp-rows"></div>
                <button class="btn-add-row" onclick="aggiungiRigaGiocatore()">+ Più giocatori</button>
                <div class="btn-action-row">
                    <button class="btn-submit" style="flex:1;" onclick="salvaGiocatoriNuovi()">&#128190; Salva Giocatori</button>
                </div>
            </div>
        </div>

        <!-- ===== VISTA 2: LISTA PARTITE DI UNA FASE ===== -->
        <div id="view-matches" style="display:none;">
            <button class="btn-back" onclick="tornaAlMenu()">&#8592; Menu Fasi</button>
            <div class="admin-panel">
                <div class="admin-section-title" id="matches-fase-title">Partite</div>
                <div class="match-list" id="fase-matches-list"></div>
            </div>
        </div>

        <!-- ===== VISTA 3: RISULTATO PARTITA ===== -->
        <div id="view-result" style="display:none;">
            <button class="btn-back" onclick="tornaAFase()">&#8592; Partite</button>
            <div class="admin-panel">

                <div class="result-header">
                    <div id="rh-badge1"></div>
                    <span class="result-team-name" id="rh-name1">Squadra 1</span>
                    <input type="number" id="goals-team1" class="score-num-input" min="0" value="0">
                    <span class="score-sep">&mdash;</span>
                    <input type="number" id="goals-team2" class="score-num-input" min="0" value="0">
                    <span class="result-team-name" id="rh-name2">Squadra 2</span>
                    <div id="rh-badge2"></div>
                </div>

                <div id="rigori-section" style="display:none;">
                    <div style="font-size:0.75rem;color:var(--text-muted);margin:0.5rem 0 0.25rem;text-align:center;letter-spacing:0.04em;">RIGORI &mdash; solo in caso di pareggio</div>
                    <div class="score-input-row" style="border-color:rgba(240,192,64,0.3);">
                        <span class="team-score-label" id="rig-label1">Squa. 1</span>
                        <input type="number" id="rigori-team1" class="score-num-input" min="0" value="0" style="border-color:rgba(240,192,64,0.4);">
                        <span class="score-sep" style="font-size:0.75rem;color:#f0c040;">rig.</span>
                        <input type="number" id="rigori-team2" class="score-num-input" min="0" value="0" style="border-color:rgba(240,192,64,0.4);">
                        <span class="team-score-label" id="rig-label2">Squa. 2</span>
                    </div>
                </div>

                <div class="events-columns">
                    <div>
                        <div class="events-col-title">Marcatori &amp; Cartellini</div>
                        <div id="events-list1"></div>
                    </div>
                    <div>
                        <div class="events-col-title">Marcatori &amp; Cartellini</div>
                        <div id="events-list2"></div>
                    </div>
                </div>

                <div class="add-event-panels">
                    <div class="add-event-panel">
                        <div class="aep-team-name" id="aep-name1">Squadra 1</div>
                        <input type="text" class="aep-search" id="aep-search1" placeholder="Cerca giocatore..." oninput="renderPickList(1)">
                        <div class="type-toggle" id="aep-toggle1">
                            <button onclick="setTipoEvento(1,'gol')">&#9917; Gol</button>
                            <button onclick="setTipoEvento(1,'giallo')">&#128992; Giallo</button>
                            <button onclick="setTipoEvento(1,'rosso')">&#128308; Rosso</button>
                        </div>
                        <div class="player-pick-list" id="pick-list1"></div>
                    </div>
                    <div class="add-event-panel">
                        <div class="aep-team-name" id="aep-name2">Squadra 2</div>
                        <input type="text" class="aep-search" id="aep-search2" placeholder="Cerca giocatore..." oninput="renderPickList(2)">
                        <div class="type-toggle" id="aep-toggle2">
                            <button onclick="setTipoEvento(2,'gol')">&#9917; Gol</button>
                            <button onclick="setTipoEvento(2,'giallo')">&#128992; Giallo</button>
                            <button onclick="setTipoEvento(2,'rosso')">&#128308; Rosso</button>
                        </div>
                        <div class="player-pick-list" id="pick-list2"></div>
                    </div>
                </div>

                <div class="form-group" style="margin-top:1.25rem;">
                    <label>MVP della partita</label>
                    <select id="mvp-select">
                        <option value="">-- Nessun MVP --</option>
                    </select>
                </div>

                <div class="btn-action-row" style="margin-top:0.5rem; margin-bottom:1rem;">
                    <button class="btn-submit btn-forfeit" style="flex:1;" onclick="vittoriaATavolino(1)">&#127937; 3-0 (squadra 1)</button>
                    <button class="btn-submit btn-forfeit" style="flex:1;" onclick="vittoriaATavolino(2)">&#127937; 0-3 (squadra 2)</button>
                </div>

                <div class="btn-action-row">
                    <button class="btn-submit" style="flex:1;" onclick="saveAll()">&#128190; SALVA TUTTO</button>
                    <button class="btn-submit btn-danger" onclick="deleteCurrentResult()">&#128465; Cancella</button>
                </div>

            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 MundialPitto. Tutti i diritti riservati.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>
